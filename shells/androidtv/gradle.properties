# R8 IS WHAT NEEDS THIS. Gradle's default daemon is 512 MiB of heap and 384 MiB
# of metaspace, and minifyReleaseWithR8 over the whole unshrunk Compose runtime
# thrashes the collector and then kills the daemon outright — the failure is
# "Gradle build daemon has been stopped", which names neither R8 nor memory.
#
# There was no gradle.properties here at all before, so these are Gradle's
# defaults made explicit rather than a tuning: nothing else in this build wants
# more than the default, and the debug variant never asked for any of it.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
