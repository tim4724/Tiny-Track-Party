<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Road strips — Tiny Track Party</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; padding: 0.8rem; background: #eef0f4; color: #1c2333; font: 600 0.9rem/1.3 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-bottom: 0.8rem; }
  h1 { font-size: 1.1rem; margin: 0 1rem 0 0; }
  header button { padding: 0.4rem 0.9rem; font: inherit; cursor: pointer; border-radius: 0.5rem; border: 2px solid #1c2333; background: #fff; color: #1c2333; }
  header button.on { background: #1c2333; color: #fff; }
  #cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 0.8rem; }
  .cell { background: #fff; border-radius: 0.8rem; padding: 0.6rem; }
  .cell[hidden] { display: none; }
  .cell h2 { font-size: 1rem; margin: 0 0 0.4rem; }
  .cell iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 0.5rem; background: #000; }
  .controls > div { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); column-gap: 1rem; }
</style>
</head>
<body>
<header>
  <h1>Road strips</h1>
  <span>Car:</span>
  <button data-car="strip">On and off</button>
  <button data-car="strip-on">On the strip</button>
  <button data-car="strip-off">On the road</button>
  <span style="margin-left:1rem">Show:</span>
  <span id="show" style="display:flex;gap:0.4rem"></span>
  <button id="copy" style="margin-left:1rem">Copy all changed values</button>
</header>
<div id="cells"></div>
<script type="module" src="/strip-compare.js"></script>
</body>
</html>
