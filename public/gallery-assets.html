<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Asset Gallery — Tiny Track Party</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/gallery.css?v=__APP_V__">
</head>
<body class="stage-page">
<header>
  <h1>TINY TRACK · ASSETS</h1>

  <div class="group">
    <select id="asset-biome" aria-label="Biome"></select>
  </div>

  <div class="group">
    <select id="asset-item" aria-label="Item roulette">
      <option value="">Item: roulette</option>
    </select>
  </div>

  <!-- The MODEL BENCH: every take on one procedural prop, in a row, so two
       shapes can be argued about side by side instead of one at a time. -->
  <div class="group">
    <select id="asset-bench" aria-label="Model bench">
      <option value="">Bench: off</option>
    </select>
  </div>

  <div class="group">
    <select id="asset-variant" aria-label="Variant in use"></select>
  </div>

  <div class="group">
    <label class="checkbox-label" for="asset-drive">
      <input type="checkbox" id="asset-drive">
      Drive
    </label>
  </div>

  <div class="group">
    <label class="checkbox-label" for="asset-legend">
      <input type="checkbox" id="asset-legend" checked>
      Legend
    </label>
  </div>

  <!-- The KIT FIELD: every model in the three Kenney kits, standing on the
       ground beyond the track. Not a picker beside the scene — the scene. -->
  <div class="group">
    <label class="checkbox-label" for="asset-kits">
      <input type="checkbox" id="asset-kits">
      Kit field
    </label>
  </div>

  <!-- In a .group so the mobile header collapses it behind ⚙ with the rest. -->
  <div class="group">
    <button class="ctrl" id="asset-home">Back to the cars</button>
  </div>

  <button class="ctrl options-toggle" id="options-toggle" aria-expanded="false" aria-label="Options">⚙</button>

  <nav>
    <a href="/gallery.html">Display</a>
    <a href="/gallery-controller.html">Phone</a>
    <a href="/gallery-tracks.html">Tracks</a>
    <a href="/gallery-assets.html" class="active">Assets</a>
    <a href="/gallery-artwork.html">Artwork</a>
    <a href="/gallery-sounds.html">Sounds</a>
    <a href="/gallery-music.html">Music</a>
    <a href="/gallery-shots.html">Screens</a>
    <a href="/licenses.html">Licenses</a>
  </nav>
</header>

<section class="stage">
  <!-- The real display page in showroom mode. Full-bleed and INTERACTIVE, unlike
       every other gallery's cards: the camera is the point here, so the frame
       takes the pointer rather than passing it through to the page. -->
  <iframe id="asset-stage" title="Asset showroom"
          src="/?scenario=assets&track=showroom"></iframe>
  <aside class="legend" id="asset-legend-panel" hidden>
    <p class="legend__hint">Drag to look · scroll to fly · WASD · Q/E</p>
    <div id="asset-legend-lists"></div>
  </aside>
  <!-- The field's TABLE OF CONTENTS. The models themselves are out there on the
       ground at their own size; this is how you find one among six hundred — a
       row flies the camera to it, and the filter rebuilds the field with only
       what matches. -->
  <aside class="kits" id="kit-sheet" hidden>
    <div class="kits__bar">
      <select id="kit-set" hidden><option value="">All kits</option></select>
      <input type="search" id="kit-filter" placeholder="Filter by name…" autocomplete="off">
      <span class="kits__count" id="kit-count"></span>
    </div>
    <div id="kit-body"></div>
  </aside>
  <!-- Deciding a SHORTLIST, one model at a time: the camera stands on it, and a
       verdict moves on to the next undecided one. Y / N / ← / → as well. -->
  <div class="decide" id="kit-decide" hidden>
    <button type="button" class="decide__step" id="kit-prev" title="Previous (←)">‹</button>
    <div class="decide__what">
      <span class="decide__name" id="kit-decide-name"></span>
      <span class="decide__meta" id="kit-decide-meta"></span>
    </div>
    <button type="button" class="decide__btn decide__btn--no" id="kit-no">No <kbd>N</kbd></button>
    <button type="button" class="decide__btn decide__btn--yes" id="kit-yes">Yes <kbd>Y</kbd></button>
    <button type="button" class="decide__step" id="kit-next" title="Next (→)">›</button>
    <span class="decide__tally" id="kit-tally"></span>
  </div>
</section>

<script src="/shared/protocol.js?v=__APP_V__"></script>
<script type="module" src="/gallery-assets.js"></script>
</body>
</html>
