<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tiny Track Party">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd775"/>
      <stop offset="1" stop-color="#f2ad33"/>
    </linearGradient>
    <pattern id="check" width="8.5" height="8.5" patternUnits="userSpaceOnUse">
      <rect width="8.5" height="8.5" fill="#f6f9fc"/>
      <rect width="4.25" height="4.25" fill="#2b333f"/>
      <rect x="4.25" y="4.25" width="4.25" height="4.25" fill="#2b333f"/>
    </pattern>
    <clipPath id="tile"><rect x="3" y="3" width="58" height="58" rx="16"/></clipPath>
    <clipPath id="flag"><path d="M20 15 C29 11.5 37 17.5 49 13.5 L49 34 C37 38 29 32 20 35.5 Z"/></clipPath>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- pole -->
    <rect x="17.4" y="12" width="4.2" height="40" rx="2.1" fill="#3c4553"/>
    <circle cx="19.5" cy="12.4" r="3" fill="#3c4553"/>
    <!-- waving checkered flag -->
    <g clip-path="url(#flag)"><rect x="16" y="8" width="38" height="32" fill="url(#check)"/></g>
    <path d="M20 15 C29 11.5 37 17.5 49 13.5 L49 34 C37 38 29 32 20 35.5 Z"
          fill="none" stroke="#2b333f" stroke-width="1.4" stroke-linejoin="round" opacity=".9"/>
  </g>
</svg>
