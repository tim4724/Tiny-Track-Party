<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#2a2735" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><!--
  Monster truck in the WHEELIE pose (picked over the flat side view,
  2026-07-31): the side profile rearing up - the crush stance. The 2D echo of the in-race transform, which grafts the player's own
