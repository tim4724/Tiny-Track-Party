<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Music Gallery — Tiny Track Party</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/gallery.css?v=__APP_V__">
<style>
/* Page-local: a track's race beside the songs to audition on it. */
.mu-stage { display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
.mu-main { min-width: 0; overflow-y: auto; background: #06060f; }
/* The race at a television's shape, as big as the column allows while the
   transport and the track list under it stay on screen. */
.mu-race {
  position: relative; background: #000;
  width: min(100%, calc((100vh - 345px) * 16 / 9));
  aspect-ratio: 16 / 9; margin: 0 auto;
}
.mu-race iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.mu-transport {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 12px;
}
.mu-transport .mu-now { flex: 0 1 260px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.mu-transport .mu-now.is-idle { font-weight: 400; color: #8b93b8; }
.mu-transport input[type=range] { flex: 1 1 160px; min-width: 80px; }
.mu-clock { color: #8b93b8; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* The track list: one column per cup, a tile per track saying what it has. */
.mu-cups { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; padding: 10px 12px 16px; }
.mu-cup h2 { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3c7; margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mu-track {
  display: block; width: 100%; margin: 0 0 5px; padding: 6px 8px; text-align: left;
  background: #10102a; color: #e0e0ff; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
  font: inherit; cursor: pointer;
}
.mu-track:hover { background: #1a1a3a; }
.mu-track.is-on { background: #2a2a5a; border-color: #5060c0; }
.mu-track b { display: block; font-size: 13px; }
.mu-track span { display: block; font-size: 11px; color: #8b93b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mu-track span.is-picked { color: #78dc96; }
.biome-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
/* The songs panel: what this track has (head) over what to audition (body). */
.mu-stage .legend {
  position: static; width: auto; max-height: none; border-radius: 0; border-width: 0 0 0 1px;
  display: flex; flex-direction: column; padding: 0; overflow: hidden; font-size: 12px;
}
.mu-head { flex: none; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.12); }
.mu-head h2 { font-size: 15px; color: #fff; margin-bottom: 2px; }
.mu-head p { color: #9aa3c7; margin: 3px 0; }
.mu-head .mu-pick { color: #e0e0ff; }
.mu-head .mu-pick b { color: #78dc96; }
.mu-head textarea {
  width: 100%; margin: 6px 0 4px; background: #0c0c1c; color: #fff; font: inherit; resize: vertical;
  border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 6px 8px;
}
.mu-head .mu-row { display: flex; gap: 6px; align-items: center; }
.mu-status { color: #8b93b8; flex: 1; min-width: 0; }
.mu-status.is-error { color: #ff8f8f; }
.mu-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 12px 16px; }
.mu-body h3 { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: #9aa3c7; margin: 14px 0 4px; }
.mu-body .mu-why { color: #d5d5ee; margin: 0 0 4px; line-height: 1.45; }
.mu-body .mu-aside { color: #6f7699; margin: 0 0 4px; line-height: 1.45; }
.mu-body details > summary { cursor: pointer; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: #9aa3c7; margin: 16px 0 4px; }
.mu-body details h4 { font-size: 11px; color: #8b93b8; font-weight: 600; margin: 10px 0 2px; }
/* One song: play, what it is, and the pick. */
.mu-song {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 6px 8px; margin: 4px 0; border-radius: 8px;
  background: #10102a; border: 1px solid rgba(255,255,255,0.08);
}
.mu-song.is-picked { border-color: #78dc96; }
.mu-song .play {
  width: 30px; height: 30px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.14);
  background: #1a1a3a; color: #e0e0ff; font-size: 12px; cursor: pointer;
}
.mu-song .play:hover { background: #24244c; }
.mu-song .play.on { background: #2a2a5a; border-color: #5060c0; }
.mu-song .play:disabled { opacity: 0.35; cursor: default; }
.mu-song .title { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mu-song .sub { font-size: 11px; color: #8b93b8; line-height: 1.5; }
.mu-song .feel { font-size: 11px; color: #b8bedc; line-height: 1.4; margin-top: 2px; }
.mu-song .sub a { color: #9fb2ff; text-decoration: none; }
.mu-song .tag { display: inline-block; border-radius: 999px; padding: 0 7px; margin-right: 4px; font-size: 10px; font-weight: 800; vertical-align: 1px; }
.tag--shipped { background: rgba(120, 220, 150, 0.16); color: #78dc96; }
.tag--draft { background: rgba(80, 96, 192, 0.3); color: #b9c3ff; }
.tag--cand { background: rgba(185, 195, 255, 0.12); color: #b9c3ff; }
.tag--missing { background: rgba(255, 143, 143, 0.18); color: #ff8f8f; }
.mu-song.is-missing .title { color: #8b93b8; }
.mu-song button.use { white-space: nowrap; }
.mu-song button.use.is-on { background: rgba(120, 220, 150, 0.2); border-color: #78dc96; color: #fff; cursor: default; }
@media (max-width: 900px) {
  body.stage-page { height: auto; overflow: visible; }
  .mu-stage { display: block; }
  .mu-race { width: 100%; }
  .mu-cups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mu-stage .legend { border-width: 1px 0 0; }
}
</style>
</head>
<body class="stage-page">
<header>
  <h1>TINY TRACK · MUSIC</h1>

  <div class="group seg" role="group" aria-label="Camera" id="mu-cams">
    <button class="ctrl" data-cam="chase" title="The race as a one-player game draws it: the chase camera behind your car, at the back of a full grid">Chase</button>
    <button class="ctrl" data-cam="follow" title="One camera following the lead battle from outside the circuit (the trailer's overview)">TV</button>
  </div>

  <div class="group">
    <label class="checkbox-label" for="vol">Volume</label>
    <input type="range" id="vol" min="0" max="100" value="60">
  </div>

  <button class="ctrl options-toggle" id="options-toggle" aria-expanded="false" aria-label="Options">⚙</button>

  <nav>
    <a href="/gallery.html">Display</a>
    <a href="/gallery-controller.html">Phone</a>
    <a href="/gallery-tracks.html">Tracks</a>
    <a href="/gallery-assets.html">Assets</a>
    <a href="/gallery-landmarks.html">Landmarks</a>
    <a href="/gallery-artwork.html">Artwork</a>
    <a href="/gallery-sounds.html">Sounds</a>
    <a href="/gallery-music.html" class="active">Music</a>
    <a href="/gallery-shots.html">Screens</a>
    <a href="/licenses.html">Licenses</a>
  </nav>
</header>

<section class="stage mu-stage">
  <div class="mu-main">
    <!-- The real display page racing the picked track (?scenario=racing: the
         bench field, autopiloted, dealt again from the grid when it ends),
         driven through its window.__preview hook. Silent in a frame, so the
         song is all you hear. -->
    <div class="mu-race"><iframe id="mu-frame" title="The race"></iframe></div>
    <div class="mu-transport">
      <button class="ctrl" id="mu-pause" title="Pause or resume the song and the race together (Space)">Pause</button>
      <button class="ctrl" id="mu-restart" title="The race from the grid and the song from its start, together (R)">Restart both</button>
      <span class="mu-now is-idle" id="mu-now">No song: ▶ one beside the race</span>
      <input type="range" id="mu-seek" min="0" max="1000" value="0" aria-label="Song position" disabled>
      <span class="mu-clock" id="mu-time">0:00</span>
      <span class="mu-clock" id="mu-lap" title="The race under the song: its clock since the grid, your car's lap and place"></span>
    </div>
    <div class="mu-cups" id="mu-cups"></div>
  </div>

  <aside class="legend mu-panel" id="mu-panel">
    <div class="mu-head">
      <h2 id="mu-title"></h2>
      <p id="mu-today"></p>
      <p class="mu-pick" id="mu-pick"></p>
      <textarea id="mu-note" rows="2" placeholder="A note on this track's music (optional)"></textarea>
      <div class="mu-row">
        <span class="mu-status" id="mu-status"></span>
        <button class="ctrl" id="mu-clear" title="Forget this track's pick">Clear pick</button>
        <button class="ctrl" id="mu-save-note">Save note</button>
      </div>
    </div>
    <div class="mu-body" id="mu-songs"></div>
  </aside>
</section>

<script type="module" src="/gallery-music.js"></script>
</body>
</html>
