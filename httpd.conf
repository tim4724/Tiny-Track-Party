# Apache for the Docker image (the k8s branch previews). The site's rules live
# in public/.htaccess; this file sets up only what Hetzner Webhosting provides
# around it (mod_rewrite, mod_headers, compression). Port 4000 and uid 1001 are
# the contract preview.yml's Deployment uses.

ServerRoot "/usr/local/apache2"
Listen 4000
ServerName localhost
# /tmp is the pod's one writable path (an emptyDir under a read-only root).
PidFile /tmp/httpd.pid
DefaultRuntimeDir /tmp

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule brotli_module modules/mod_brotli.so

TypesConfig conf/mime.types
DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
  Options FollowSymLinks
  AllowOverride All
  Require all granted
</Directory>
<Files ".ht*">
  Require all denied
</Files>

# Errors only. No access log: the ingress keeps that, and container output has
# no age limit.
ErrorLog /proc/self/fd/2
LogLevel warn

# Like Hetzner: revalidate by Last-Modified only. mod_brotli suffixes the ETag
# of a compressed response, which then never matches If-None-Match, so every
# revalidation would re-download the file. Which types are compressed is the
# .htaccess's.
FileETag None
