name: Release

# What a release needs, in one workflow:
#
#   - the signed store build (leanback REQUIRED), kept as a workflow artifact
#     and published to Play's tv:beta, the Android TV open test.
#   - the Apple TV build, archived, uploaded to App Store Connect and sent to
#     the public TestFlight link.
#
# NOT the store screenshots: those are the `store` cards of the screens gallery,
# captured on a dev machine and committed (public/shared/galleryScenarios.js),
# and /gallery-shots.html zips each TV's set for the consoles.
#
# WHY THIS IS NOT androidtv.yml WITH A KEYSTORE. That leg is compile-only and
# passes -PttpNoEngine, so its APK carries no engine and is unloadable by
# design. A store build has to produce the real thing, which means the whole
# native chain on a runner that has none of it: the pinned Filament fork built
# as an Android SDK for BOTH ABIs, the NDK that fork pins, and a host matc for
# the Android-only SPIR-V material set. That is hours of build, so it is
# CACHED ON THE PIN — .github/actions/filament-android-sdk for Android, the
# Filament steps of the tvos job for Apple TV.
#
# Trigger: a bare-semver release tag (the repo's tag convention), and nothing
# else — no manual run either, so a change to this pipeline is tested by cutting
# a patch tag. Never pull_request, so the signing secrets are only reachable by
# people who can push.
#
# RECOVERY. Each store upload is the last step of its job, so a failed upload
# has used up no version code or build number, and "Re-run failed jobs" is the
# retry — the testflight job's too, which only talks to App Store Connect. A
# fix needs a new patch tag: a re-run runs the tagged commit's workflow file.
#
# THE CACHES ARE WARMED ON MAIN, by the workflows a filament.pin bump already
# runs: native.yml's release-android-sdk job builds and saves the Android SDK
# under the key this restores, and tvos.yml does the same for the tvOS one.
# Caches written on the default branch are what tag runs restore, and both
# workflows run on a schedule, which keeps the caches read inside the week
# GitHub keeps an unread one.
#
# Secrets (Settings > Environments > release, which admits only release tags,
# so no branch can read them):
#   ANDROID_KEYSTORE_B64       base64 of the upload keystore .jks
#   ANDROID_KEYSTORE_PASSWORD  keystore store password
#   ANDROID_KEY_ALIAS          key alias (tinytrack-tv)
#   ANDROID_KEY_PASSWORD       key password. The keystore is PKCS12, which has
#                              no separate key password, so this is the STORE
#                              password again — not empty.
#   PLAY_SERVICE_ACCOUNT_JSON  JSON key of the Play API service account, granted
#                              "Release to testing tracks" on the app in Play
#                              Console (Users and permissions, not Cloud IAM)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  androidtv:
    runs-on: ubuntu-latest
    environment: release
    # A cache miss means building Filament for two ABIs plus the host tools.
    # The cap is the job limit, not an estimate: a hit finishes in minutes.
    timeout-minutes: 360
    # The bundle, named once, because three steps below need its path.
    env:
      TV_AAB: shells/androidtv/app/build/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          # 17 is what app/build.gradle.kts targets for both source and jvmTarget.
          java-version: 25
          distribution: temurin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Only native/scripts/build-runtime-android.sh's JNI codegen needs Node,
          # and it imports node: builtins only — there is no npm ci here.
          node-version-file: .nvmrc
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # The fork at FILAMENT_SRC, the NDK it pins as NDK_VERSION, and its Android
      # SDK restored or built. Shared with native.yml's release-android-sdk job,
      # which keeps that cache warm from main; the action's notes say why the
      # two must not carry copies of their own.
      - name: The Filament Android SDK
        uses: ./.github/actions/filament-android-sdk

      # app/build.gradle.kts reads this file and falls back to DEBUG SIGNING when
      # it is absent, which would produce a bundle Play rejects. The verify step
      # after the build is what makes that fallback safe to have.
      - name: Materialize the upload keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > shells/androidtv/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # Both ABIs: armeabi-v7a is not a legacy fallback here, a Google TV
      # Streamer has no /system/bin/linker64 and cannot load an arm64 build.
      - name: Build the engine
        run: native/scripts/build-runtime-android.sh both

      # run*2+101 IS A LEGACY, NOT A DESIGN. Runs used to stamp two codes, a
      # phone bundle's on the even one and this bundle's on the odd one above
      # it, and Play refuses a code it has seen on ANY track. Keeping the odd
      # half keeps every new code above all of those; a plainer formula would
      # restart below them. +100 still reserves the band below for bundles
      # built and uploaded by hand, of which there are four. The tag is the
      # versionName. Both are command-line overrides: the static values in the
      # build file stay put.
      - name: Build the release bundle (.aab)
        working-directory: shells/androidtv
        run: |
          ./gradlew bundleRelease --console=plain --stacktrace \
            "-PttpVersionCode=$((GITHUB_RUN_NUMBER * 2 + 101))" "-PttpVersionName=$GITHUB_REF_NAME"

      # THE FALLBACK'S GUARD RAIL. app/build.gradle.kts signs with the debug key
      # when keystore.properties is absent or unreadable, which is what keeps the
      # compile-only leg and a fresh worktree building a release APK with no
      # secret. Here that same fallback would hand Play an artifact signed by the
      # wrong key, so prove the upload key was actually picked up.
      #
      # An EQUALITY against the keystore's own certificate, not a search for
      # "Android Debug" in the output: a negative grep also passes when keytool
      # prints nothing at all, which is the one case worth catching. Both sides
      # go through -printcert so the labels match whatever locale the runner is
      # in — the other subcommands translate theirs.
      - name: Verify the release signature
        env:
          AAB: ${{ env.TV_AAB }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          want=$(keytool -exportcert -keystore "$RUNNER_TEMP/upload-keystore.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -rfc |
            keytool -printcert | grep -m1 'SHA256:' | tr -d ' ')
          got=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | tr -d ' ')
          echo "keystore $want"
          echo "bundle   $got"
          if [ -z "$got" ] || [ "$want" != "$got" ]; then
            echo "::error::$AAB is not signed with the upload key"
            exit 1
          fi

      # Before publishing, so a Play-side rejection still leaves the bundle
      # downloadable from the run.
      - name: Upload the .aab artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tinytrack-bundles
          path: ${{ env.TV_AAB }}
          if-no-files-found: error

      # The engine .so ships exporting only its JNI entry points, so a tombstone
      # from a store install names no function until it meets these: the
      # unstripped links of THIS run, one per ABI, named by build id
      # (build-runtime-android.sh). `ndk-stack -sym <this folder> -i <tombstone>`.
      - name: Upload the engine's native symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tinytrack-android-symbols
          path: native/build/android-symbols/
          if-no-files-found: error

      # "tv:" is the Android TV form factor prefix, and the form factor is the
      # one part of this that has NO API: androidpublisher v3 has no form-factor
      # resource, and TrackConfig.formFactor enumerates DEFAULT, WEAR and
      # AUTOMOTIVE only. A tv: track cannot be created here, only published to,
      # so the console declaration comes first. tv:beta is the TV form factor's
      # OPEN test: anyone on a television can join from the listing. Its
      # countries are a console setting with no API either (countryAvailability
      # is read-only), and until it has some every commit to it is refused
      # ("Release in track targeting no countries"). tv:tv, the closed track
      # Play created with the form factor, is no longer published to.
      #
      # Open testing goes out completed, not draft: Play still reviews the
      # release, and joining is the tester's choice. Point this at tv:production
      # and the draft gate has to come back. mapping.txt goes with it or every
      # crash report from an R8 build is unreadable.
      #
      # A commit while other changes are in review cancels that review and
      # resubmits everything together (Play's default; the action has no switch
      # for it), so don't tag while a production release is in review.
      - name: Publish TV bundle to Play (tv:beta)
        id: play
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: games.paperballoon.tinytrack
          releaseFiles: ${{ env.TV_AAB }}
          mappingFile: shells/androidtv/app/build/outputs/mapping/release/mapping.txt
          tracks: tv:beta
          status: completed

      # While the app has an open rejection, Play refuses an edit that sends
      # itself for review. The release still lands, held until someone presses
      # "Send for review" in Play Console, where it joins whatever else is
      # waiting there.
      - name: Publish TV bundle to Play, held for review in the console
        if: steps.play.outcome == 'failure'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: games.paperballoon.tinytrack
          releaseFiles: ${{ env.TV_AAB }}
          mappingFile: shells/androidtv/app/build/outputs/mapping/release/mapping.txt
          tracks: tv:beta
          status: completed
          changesNotSentForReview: true

  # THE APPLE TV STORE BUILD: archive and upload to App Store Connect. The
  # testflight job after it sends the build to the public TestFlight link.
  #
  # WHY THIS IS NOT tvos.yml WITH A CERTIFICATE. That leg builds the SIMULATOR
  # slice unsigned, because it runs on pull requests where secrets must not be
  # reachable. A store build is the device slice, signed, packaged as an .ipa
  # with the Top Shelf extension embedded — none of which a PR may do.
  #
  # IT RESTORES THE CACHE tvos.yml WRITES, which is the whole reason that leg
  # runs on main as well as on PRs: caches written on the default branch are what
  # tag runs restore, so a cold Filament tvOS cross build should never happen
  # inside a release. The Android SDK is warmed the same way, by native.yml.
  #
  # NO TRACKS, unlike Play. Apple has no track concept: an accepted upload
  # processes and is then available to internal TestFlight testers, and the
  # public link's testers get it once it is in that link's group and has passed
  # beta app review — the testflight job below. So there is nothing here that
  # corresponds to the tv:beta track above, and no status to choose.
  #
  # Secrets (Settings > Environments > release, which admits only release tags,
  # so no branch can read them):
  #   APPLE_DIST_CERT_P12_B64   base64 of an Apple Distribution certificate +
  #                             private key, exported from Keychain as .p12
  #   APPLE_DIST_CERT_PASSWORD  the password that .p12 was exported with
  #   APPLE_TEAM_ID             the 10-character team id (the cert's OU field —
  #                             shells/tvos/scripts/lib.sh derives it the same
  #                             way for a local device build)
  #   ASC_KEY_ID                App Store Connect API key id
  #   ASC_ISSUER_ID             that key's issuer id
  #   ASC_KEY_P8_B64            base64 of the key's .p8. APP MANAGER IS ENOUGH,
  #                             and that is the point of signing manually: the
  #                             key is used to upload and for nothing else.
  #                             Automatic signing would have Xcode ask Apple to
  #                             mint the profiles ("cloud signing"), which needs
  #                             an ADMIN key — a team-wide credential on a runner,
  #                             traded for not creating two profiles by hand.
  #   APPLE_PROFILE_APP_B64     base64 of the "Tiny Track Party tvOS App Store"
  #                             .mobileprovision (games.paperballoon.tinytrack)
  #   APPLE_PROFILE_TOPSHELF_B64  the same for "Tiny Track Party Top Shelf App
  #                             Store" (games.paperballoon.tinytrack.topshelf). An
  #                             appex cannot ride its host's profile.
  #
  # BOTH PROFILES EXPIRE, about a year out, and that is the cost of this trade.
  # It is a LOUD failure — the export names the profile it could not resolve —
  # but it is a failure inside a release, so renew them before a tag rather than
  # during one. The names above are a contract with shells/tvos/project.yml,
  # which selects them by PROVISIONING_PROFILE_SPECIFIER.
  tvos:
    runs-on: xcode-27
    environment: release
    # A cache miss means building Filament for two tvOS SDKs plus the partial
    # desktop build it needs for matc. The cap is the job limit, not an
    # estimate: a hit finishes in minutes.
    timeout-minutes: 360
    env:
      ARCHIVE: ${{ github.workspace }}/build/TinyTrackParty.xcarchive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Xcode local builds use, and the one tvos.yml builds and warms the
      # Filament cache with.
      - name: Select latest stable Xcode 27
        run: |
          # Real bundles only (the image's Xcode_27.2.app is a symlink to a beta), no
          # betas, newest by the bundle's own version (the RC folder name sorts badly).
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' ! -name '*beta*' \
            | while read -r x; do echo "$(defaults read "$x/Contents/Info" CFBundleShortVersionString) $x"; done \
            | sort -V | tail -1 | cut -d' ' -f2-)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      # The Xcode major is part of the cache key, as in tvos.yml.
      - name: Read the Filament pin and the Xcode major
        id: pin
        run: |
          set -eu
          . native/filament.pin
          {
            echo "commit=$FILAMENT_COMMIT"
            echo "remote=$FILAMENT_REMOTE"
            echo "xcode=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Only the two staging generators need Node, and they import node:
          # builtins plus this repo's own ESM — there is no npm ci here.
          node-version-file: .nvmrc

      # ffmpeg IS REQUIRED HERE, unlike on the PR leg. stage-assets.sh transcodes
      # the Ogg engine loop to PCM WAV because no Apple platform decodes Vorbis,
      # and WITHOUT ffmpeg it warns and stages nothing — a build that ships with a
      # silent engine voice and no error anywhere. The check after staging is what
      # turns that fallback into a failure on this leg only.
      - name: Install the build tools
        run: |
          set -eu
          for f in ninja xcodegen ffmpeg; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done

      - name: Fetch the pinned Filament fork
        run: |
          set -eu
          SRC="$RUNNER_TEMP/filament"
          mkdir -p "$SRC"
          git -C "$SRC" init -q
          git -C "$SRC" remote add origin "${{ steps.pin.outputs.remote }}"
          git -C "$SRC" fetch -q --depth 1 origin "${{ steps.pin.outputs.commit }}"
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          echo "FILAMENT_SRC=$SRC" >> "$GITHUB_ENV"

      # Keyed and pathed identically to .github/workflows/tvos.yml, which is what
      # makes that leg the cache warmer for this one. Read its notes before
      # changing either: the install trees only (never out/cmake-tvos-*, whose
      # CMakeCache would trip require_local_install), and no restore-keys.
      - name: Restore the Filament tvOS SDK
        id: filament-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/filament/out/tvos-release/filament-appletvos
            ${{ runner.temp }}/filament/out/tvos-release/filament-appletvsimulator
            ${{ runner.temp }}/filament/out/cmake-release/tools/matc/matc
          key: filament-tvos-xcode${{ steps.pin.outputs.xcode }}-${{ steps.pin.outputs.commit }}

      - name: Build the Filament tvOS SDK (pin bump only)
        if: steps.filament-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/filament
        run: |
          set -eu
          ./build.sh -s -i -p tvos release
          for sdk in appletvos appletvsimulator; do
            cmake --install "out/cmake-tvos-release-arm64-$sdk" \
              --prefix "out/tvos-release/filament-$sdk"
            test -f "out/tvos-release/filament-$sdk/include/filament/Engine.h"
          done
          test -x out/cmake-release/tools/matc/matc

      # Directly after the build, not in a post step: everything below can fail
      # for reasons that have nothing to do with Filament, and a missing secret
      # is enough. The Android job lost a completed hour-long build that way.
      - name: Save the Filament tvOS SDK
        if: steps.filament-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/filament/out/tvos-release/filament-appletvos
            ${{ runner.temp }}/filament/out/tvos-release/filament-appletvsimulator
            ${{ runner.temp }}/filament/out/cmake-release/tools/matc/matc
          key: filament-tvos-xcode${{ steps.pin.outputs.xcode }}-${{ steps.pin.outputs.commit }}

      # A THROWAWAY KEYCHAIN, discarded with the runner. The import needs -T for
      # each tool allowed to use the key AND the partition list set afterwards,
      # or codesign blocks on a UI prompt that no runner can answer and the job
      # hangs until its timeout.
      #
      # The preflight loop is the Android job's, for the same reason: an empty
      # secret otherwise fails deep inside xcodebuild with a signing error that
      # reads like a project defect. It checks the upload's key too, so a missing
      # one fails here and not after the archive.
      - name: Materialize the signing identity from secrets
        env:
          APPLE_DIST_CERT_P12_B64: ${{ secrets.APPLE_DIST_CERT_P12_B64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          APPLE_PROFILE_APP_B64: ${{ secrets.APPLE_PROFILE_APP_B64 }}
          APPLE_PROFILE_TOPSHELF_B64: ${{ secrets.APPLE_PROFILE_TOPSHELF_B64 }}
        run: |
          set -eu
          for v in APPLE_DIST_CERT_P12_B64 APPLE_DIST_CERT_PASSWORD APPLE_TEAM_ID \
                   ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64 \
                   APPLE_PROFILE_APP_B64 APPLE_PROFILE_TOPSHELF_B64; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_DIST_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$APPLE_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # APPEND to the search list rather than replacing it: xcodebuild also
          # reads the login keychain for Apple's intermediate certificates, and a
          # bare `-s "$KEYCHAIN"` drops them ("no signing certificate found").
          # The unquoted substitution is the point — the existing list is several
          # paths and each has to arrive as its own argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          # BY UUID, which is the only name Xcode resolves a profile by on disk.
          # The human name inside it is what project.yml's
          # PROVISIONING_PROFILE_SPECIFIER and the export options match on, so a
          # profile renamed in the portal breaks the build by name, loudly.
          PROFDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFDIR"
          for pair in "app:$APPLE_PROFILE_APP_B64" "topshelf:$APPLE_PROFILE_TOPSHELF_B64"; do
            f="$RUNNER_TEMP/${pair%%:*}.mobileprovision"
            echo "${pair#*:}" | base64 --decode > "$f"
            uuid=$(security cms -D -i "$f" | plutil -extract UUID raw -o - -)
            name=$(security cms -D -i "$f" | plutil -extract Name raw -o - -)
            cp "$f" "$PROFDIR/$uuid.mobileprovision"
            echo "installed profile '$name' ($uuid)"
            rm -f "$f"
          done

          echo "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      # Engine (device slice), Metal materials, staged bundle, xcodegen. NOT
      # build.sh — that one owns its own xcodebuild with a `build` verb, and this
      # job needs `archive`. prepare.sh is the split that exists for exactly this.
      - name: Prepare the app (engine, materials, bundle, project)
        run: shells/tvos/scripts/prepare.sh device

      # THE ffmpeg FALLBACK'S GUARD RAIL, and the counterpart of the Android
      # job's signature check: stage-assets.sh is deliberately tolerant of a
      # missing transcoder so a fresh worktree still builds, and on this one leg
      # that tolerance would ship a game whose cars make no sound.
      - name: The engine voice must be in the bundle
        run: |
          set -eu
          f=shells/tvos/Generated/assets/audio/engine_loop.wav
          [ -s "$f" ] || { echo "::error::$f is missing — ffmpeg did not run"; exit 1; }

      # ONE BUILD NUMBER PER RUN, and both targets take it: project.yml reads
      # CURRENT_PROJECT_VERSION into the app's CFBundleVersion and the Top Shelf
      # appex's alike, because App Store Connect rejects an extension that
      # disagrees with its host.
      #
      # GITHUB_RUN_NUMBER does not change on a re-run, so a re-run presents the
      # same build number: fine after a failed upload, which used none up.
      #
      # The tag is the MARKETING_VERSION. Both are command-line overrides — the
      # values in the spec stay put.
      - name: Archive
        run: |
          set -eu
          # NO -allowProvisioningUpdates AND NO AUTH FLAGS. Both exist to let
          # Xcode mint provisioning on demand, and the profiles are already on
          # disk — passing them would re-enable the cloud-signing path this job
          # deliberately does not use, and would need an Admin key again.
          # The scheme archives Release, which is the only config project.yml
          # puts manual signing on.
          xcodebuild -project shells/tvos/TinyTrackParty.xcodeproj -scheme TinyTrackParty \
            -destination 'generic/platform=tvOS' -archivePath "$ARCHIVE" \
            "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM" \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" "MARKETING_VERSION=$GITHUB_REF_NAME" \
            archive

      # Keep the debug symbols with the build, needed to symbolicate crash
      # reports for exactly this binary once the .ipa itself lives in TestFlight.
      # Before the upload, which stays the job's last step.
      - name: Upload the dSYMs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tinytrack-tvos-dsyms
          path: ${{ env.ARCHIVE }}/dSYMs
          if-no-files-found: error

      # method: app-store-connect is the Xcode 15.3+ name for what used to be
      # `app-store`. destination=upload: exporting the archive sends it to App
      # Store Connect, which validates it on the way in. The key flags are for
      # that upload alone — signing stays manual, so an App Manager key is still
      # enough.
      #
      # Generated rather than checked in: the only thing in it that varies is the
      # team id, and a committed copy would be a second source for it.
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -eu
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>games.paperballoon.tinytrack</key><string>Tiny Track Party tvOS App Store</string>
              <key>games.paperballoon.tinytrack.topshelf</key><string>Tiny Track Party Top Shelf App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <!-- Or xcodebuild rewrites what the archive already stamped: the
                 run number is the build number App Store Connect will refuse a
                 second time, and it is decided at archive, not here. -->
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

  # Waits for Apple's processing, then adds the build to the "Public" group and
  # submits it for beta app review; the script's header says why that is not an
  # xcodebuild verb. The review itself takes hours and is not waited on. Its own
  # job on a cheap runner, since it mostly waits, and so "Re-run failed jobs"
  # retries it alone with the build number the upload used.
  testflight:
    needs: tvos
    runs-on: ubuntu-latest
    environment: release
    # The script gives up on processing after an hour.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node builtins only: no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Send the build to the public TestFlight link
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_B64" | base64 --decode > ~/.appstoreconnect/private_keys/"AuthKey_$ASC_KEY_ID.p8"
          node shells/tvos/scripts/testflight-public.mjs games.paperballoon.tinytrack \
            "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"
