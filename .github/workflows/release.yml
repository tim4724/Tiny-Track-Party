name: Release

# What a release needs, in one workflow:
#
#   - the signed store builds: TWO bundles out of ONE native build, kept as a
#     workflow artifact and, on a release tag, published to Play. The TV bundle
#     (leanback REQUIRED) goes to tv:Alpha. The phoneTest bundle (leanback
#     optional plus a LAUNCHER filter) goes to the ordinary alpha track,
#     because Play's twelve-testers-for-fourteen-continuous-days gate is per
#     APP, and a tester who owns no television cannot install the TV one.
#   - the store SCREENSHOTS, as a second artifact. Both jobs are independent;
#     the pictures do not wait for the engine and cannot be lost to it failing.
#
# WHY THIS IS NOT androidtv.yml WITH A KEYSTORE. That leg is compile-only and
# passes -PttpNoEngine, so its APK carries no engine and is unloadable by
# design. A store build has to produce the real thing, which means the whole
# native chain on a runner that has none of it: the pinned Filament fork built
# as an Android SDK for BOTH ABIs, the NDK that fork pins, and a host matc for
# the Android-only SPIR-V material set. That is hours of build, so it is
# CACHED ON THE PIN — see the two steps that do it.
#
# Triggers: a bare-semver release tag (the repo's tag convention) or manual
# dispatch. Never pull_request, so the signing secrets are only reachable by
# people who can push.
#
# A DISPATCH IS THE CACHE WARMER as well as the end-to-end test. It builds and
# uploads the bundle but never publishes, so after a filament.pin bump the way
# to avoid a tag that sits in a Filament build for hours is to dispatch this
# once on main first. Caches written on the default branch are what tag runs
# restore.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_B64       base64 of the upload keystore .jks
#   ANDROID_KEYSTORE_PASSWORD  keystore store password
#   ANDROID_KEY_ALIAS          key alias (tinytrack-tv)
#   ANDROID_KEY_PASSWORD       key password. The keystore is PKCS12, which has
#                              no separate key password, so this is the STORE
#                              password again — not empty.
#   PLAY_SERVICE_ACCOUNT_JSON  JSON key of the Play API service account, granted
#                              "Release to testing tracks" on the app in Play
#                              Console (Users and permissions, not Cloud IAM)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  androidtv:
    runs-on: ubuntu-latest
    # A cache miss means building Filament for two ABIs plus the host tools.
    # The cap is the job limit, not an estimate: a hit finishes in minutes.
    timeout-minutes: 360
    # Both bundles, named once, because four steps below need the paths. The
    # phoneTest file name is AGP's variant convention (app-<variant>.aab), not
    # a choice made here.
    env:
      TV_AAB: shells/androidtv/app/build/outputs/bundle/release/app-release.aab
      PHONE_AAB: shells/androidtv/app/build/outputs/bundle/phoneTest/app-phoneTest.aab
    steps:
      - uses: actions/checkout@v6

      - name: Read the Filament pin
        id: pin
        run: |
          set -eu
          . native/filament.pin
          echo "commit=$FILAMENT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "remote=$FILAMENT_REMOTE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          # 17 is what app/build.gradle.kts targets for both source and jvmTarget.
          java-version: 17
          distribution: temurin
      - uses: actions/setup-node@v6
        with:
          # Only native/scripts/build-runtime-android.sh's JNI codegen needs Node,
          # and it imports node: builtins only — there is no npm ci here.
          node-version: 26
      - uses: gradle/actions/setup-gradle@v4

      # OUTSIDE THE WORKSPACE, unlike actions/checkout's path:, which refuses to
      # leave it. A 1.6 GB tree inside the repo would also make every
      # `git status --porcelain` dirty, and that string ends up in versionName.
      #
      # FILAMENT_SRC is an allowed override of filament-checkout.sh's
      # version-addressed default, but only AT the pinned commit — which is why
      # this fetches the commit itself rather than a branch.
      - name: Fetch the pinned Filament fork
        run: |
          set -eu
          SRC="$RUNNER_TEMP/filament"
          mkdir -p "$SRC"
          git -C "$SRC" init -q
          git -C "$SRC" remote add origin "${{ steps.pin.outputs.remote }}"
          git -C "$SRC" fetch -q --depth 1 origin "${{ steps.pin.outputs.commit }}"
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          echo "FILAMENT_SRC=$SRC" >> "$GITHUB_ENV"

      # The NDK the FORK pins, not the runner's newest: Filament and this tree
      # must agree, and two NDKs means two libc++ builds on one link line.
      - name: Install the NDK the fork pins
        run: |
          set -eu
          NDK_VERSION=$(grep GITHUB_NDK_VERSION "$FILAMENT_SRC/build/common/versions" | cut -d= -f2)
          echo "installing NDK $NDK_VERSION"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

      # KEYED ON THE PIN AND NOTHING ELSE, because nothing else changes what is
      # in here: the pin names one fork commit, and the SDK is wholly derived
      # from it. No restore-keys — a near-miss would restore a DIFFERENT
      # Filament's headers and libs, and MATERIAL_VERSION mismatches surface as
      # a material that fails to parse on the box, not as a build error.
      #
      # ~111 MB installed for both ABIs, plus the host matc. That matc is the one
      # `build.sh -p android` builds for itself, under out/prebuilt-tools-release
      # — NOT a desktop build's out/cmake-release, which nothing here produces.
      # RESTORE AND SAVE AS SEPARATE STEPS, not one actions/cache. The combined
      # action only writes the cache in its post step WHEN THE JOB SUCCEEDS, and
      # this job has six steps after the build that can fail for reasons that
      # have nothing to do with Filament — a missing secret is enough. That threw
      # away a completed hour-long build once already. The save sits directly
      # after the build instead, so the artifact survives whatever happens later.
      - name: Restore the Filament Android SDK
        id: filament-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/filament/out/android-release
            ${{ runner.temp }}/filament/out/prebuilt-tools-release/tools/matc/matc
          key: filament-android-${{ steps.pin.outputs.commit }}

      # Both ABIs install under ONE root. The android target also builds the
      # host tools, which is where the matc comes from — and matc is what
      # compiles the SPIR-V material set (materials-android-vk) that
      # VulkanPolicy probes for, so a bundle built without it pins every
      # install to the GL backend.
      #
      # CC/CXX ARE NOT OPTIONAL. Filament's CMakeLists rejects GCC outright
      # ("Detected CXX compiler GNU is unsupported"), and an Ubuntu runner's
      # /usr/bin/c++ is GCC, so without these the host-tools pass fails in the
      # first fifteen seconds of what is otherwise an hours-long step.
      - name: Build the Filament Android SDK
        if: steps.filament-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/filament
        env:
          CC: clang
          CXX: clang++
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libc++-dev libc++abi-dev \
            libglu1-mesa-dev libxi-dev libxcomposite-dev libxxf86vm-dev \
            mesa-common-dev
          ./build.sh -i -q armeabi-v7a -p android release
          ./build.sh -i -q arm64-v8a   -p android release

      # Keyed and pathed identically to the restore above, or the next run's
      # restore misses and rebuilds what this just saved.
      - name: Save the Filament Android SDK
        if: steps.filament-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/filament/out/android-release
            ${{ runner.temp }}/filament/out/prebuilt-tools-release/tools/matc/matc
          key: filament-android-${{ steps.pin.outputs.commit }}

      # app/build.gradle.kts reads this file and falls back to DEBUG SIGNING when
      # it is absent, which would produce a bundle Play rejects. The verify step
      # after the build is what makes that fallback safe to have.
      - name: Materialize the upload keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          for v in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(eval "echo \"\$$v\"")" ]; then
              echo "::error::secret $v is not set"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > shells/androidtv/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # Both ABIs: armeabi-v7a is not a legacy fallback here, a Google TV
      # Streamer has no /system/bin/linker64 and cannot load an arm64 build.
      - name: Build the engine
        run: native/scripts/build-runtime-android.sh both

      # TWO CODES PER RUN, and THE TV BUNDLE TAKES THE HIGHER OF THE PAIR.
      # Both reasons point the same way:
      #
      #   - Version codes are ONE SPACE across every track, so whichever bundle
      #     is lower shows as "replaced by another release" in the console. Put
      #     that on the phone track, not on the one the TV listing is promoted
      #     from. (We have already chased this once, from the other side.)
      #   - phoneTest makes leanback OPTIONAL, so a TELEVISION is compatible
      #     with BOTH bundles, and Play serves a device the highest code it can
      #     install. Invert the pair and TVs get the phone manifest — the exact
      #     thing src/phoneTest/AndroidManifest.xml exists to keep off them.
      #
      # run*2 because one run now stamps two of them; +100 still reserves the
      # band below for bundles built and uploaded by hand, of which there are
      # four. Tag builds take their versionName from the tag, a dispatch keeps
      # build.gradle.kts's commit-stamped default. All of it is a command-line
      # override: the static values in the build file stay put.
      #
      # Two gradlew invocations rather than one with both tasks, because
      # -PttpVersionCode is a project property and there is one of it per
      # invocation. The second run is cheap — same engine .so, same Kotlin,
      # only R8 and packaging again.
      - name: Build release bundles (.aab)
        working-directory: shells/androidtv
        run: |
          set -eu
          BASE=$((GITHUB_RUN_NUMBER * 2 + 100))
          ARGS=(--console=plain --stacktrace)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ARGS+=("-PttpVersionName=$GITHUB_REF_NAME")
          fi
          ./gradlew bundlePhoneTest "${ARGS[@]}" "-PttpVersionCode=$BASE"
          ./gradlew bundleRelease   "${ARGS[@]}" "-PttpVersionCode=$((BASE + 1))"

      # THE FALLBACK'S GUARD RAIL. app/build.gradle.kts signs with the debug key
      # when keystore.properties is absent or unreadable, which is what keeps the
      # compile-only leg and a fresh worktree building a release APK with no
      # secret. Here that same fallback would hand Play an artifact signed by the
      # wrong key, so prove the upload key was actually picked up. BOTH bundles:
      # phoneTest inherits the signing config through initWith, and "inherits"
      # is a claim worth checking rather than trusting.
      #
      # An EQUALITY against the keystore's own certificate, not a search for
      # "Android Debug" in the output: a negative grep also passes when keytool
      # prints nothing at all, which is the one case worth catching. Both sides
      # go through -printcert so the labels match whatever locale the runner is
      # in — the other subcommands translate theirs.
      - name: Verify release signatures
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          want=$(keytool -exportcert -keystore "$RUNNER_TEMP/upload-keystore.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -rfc |
            keytool -printcert | grep -m1 'SHA256:' | tr -d ' ')
          echo "keystore $want"
          # Named paths, not a glob: a glob that matches nothing walks straight
          # through the loop and reports success.
          for aab in "$TV_AAB" "$PHONE_AAB"; do
            [ -f "$aab" ] || { echo "::error::$aab was not built"; exit 1; }
            got=$(keytool -printcert -jarfile "$aab" | grep -m1 'SHA256:' | tr -d ' ')
            echo "$(basename "$aab") $got"
            if [ -z "$got" ] || [ "$want" != "$got" ]; then
              echo "::error::$aab is not signed with the upload key"
              exit 1
            fi
          done

      # Before publishing, so a Play-side rejection still leaves both bundles
      # downloadable from the run. They keep their variant directories inside
      # the artifact, which is the only thing telling them apart once
      # downloaded.
      - name: Upload .aab artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tinytrack-bundles
          path: |
            ${{ env.TV_AAB }}
            ${{ env.PHONE_AAB }}
          if-no-files-found: error

      # TAGS ONLY, unlike the artifact above. A dispatch is a build — the
      # end-to-end test and the cache warmer — and a build is not a release, so
      # it must not be able to put anything in front of a tester. Dispatch means
      # "build it and hand me the artifact"; the tag is the only thing that
      # publishes.
      #
      # "tv:" is the Android TV form factor prefix, and the form factor is the
      # one part of this that has NO API: androidpublisher v3 has no form-factor
      # resource, and TrackConfig.formFactor enumerates DEFAULT, WEAR and
      # AUTOMOTIVE only. A tv: track cannot be created here, only published to,
      # so the console declaration comes first. tv:Alpha is confirmed live
      # (edits.tracks.list also lists tv, tv:internal, tv:beta, tv:production);
      # the suffix is the console's name verbatim, capital A included.
      #
      # Closed testing goes out completed, not draft: testers opted in, and Play
      # still reviews the release. Point this at tv:production and the draft gate
      # has to come back. mapping.txt goes with it or every crash report from an
      # R8 build is unreadable.
      #
      # TWO STEPS, AND EACH IS ITS OWN PLAY EDIT. There is no transaction across
      # them, so a failure in the second leaves the first published. THAT IS NOT
      # RE-RUNNABLE: GITHUB_RUN_NUMBER does not change on a re-run, so the codes
      # come out identical and the TV upload refuses its own as already used.
      # Recover by moving the tag, not by pressing re-run.
      - name: Publish TV bundle to Play (tv:Alpha)
        if: github.ref_type == 'tag'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: games.couchpad.tinytrack
          releaseFiles: ${{ env.TV_AAB }}
          mappingFile: shells/androidtv/app/build/outputs/mapping/release/mapping.txt
          track: tv:Alpha
          status: completed

      # THE TESTER COUNT LIVES HERE. `alpha` is the default form factor's closed
      # track, which is the one twelve people can actually opt into without
      # owning a television — and the gate is per app, so clearing it here
      # clears it for the TV listing too. A tv: track will NOT take this bundle
      # (Play: "does not require features that are required on this track:
      # android.software.leanback"), which is also why there is no one shared
      # track to put both on.
      - name: Publish phone bundle to Play (alpha)
        if: github.ref_type == 'tag'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: games.couchpad.tinytrack
          releaseFiles: ${{ env.PHONE_AAB }}
          mappingFile: shells/androidtv/app/build/outputs/mapping/phoneTest/mapping.txt
          track: alpha
          status: completed

  # THE APPLE TV STORE BUILD: archive, export, validate, and — on a tag only —
  # upload to App Store Connect.
  #
  # WHY THIS IS NOT tvos.yml WITH A CERTIFICATE. That leg builds the SIMULATOR
  # slice unsigned, because it runs on pull requests where secrets must not be
  # reachable. A store build is the device slice, signed, packaged as an .ipa
  # with the Top Shelf extension embedded — none of which a PR may do.
  #
  # IT RESTORES THE CACHE tvos.yml WRITES, which is the whole reason that leg
  # runs on main as well as on PRs: caches written on the default branch are what
  # tag runs restore, so a cold Filament tvOS cross build should never happen
  # inside a release. After a filament.pin bump, dispatch this once on main
  # first, exactly as the Android job's header advises.
  #
  # NO TRACKS, unlike Play. Apple has no track concept: an accepted upload
  # processes and is then available to internal TestFlight testers, and external
  # testing needs a beta review in the console. So there is nothing here that
  # corresponds to the tv:Alpha / alpha split above, and no status to choose.
  #
  # Secrets (repo Settings > Secrets and variables > Actions):
  #   APPLE_DIST_CERT_P12_B64   base64 of an Apple Distribution certificate +
  #                             private key, exported from Keychain as .p12
  #   APPLE_DIST_CERT_PASSWORD  the password that .p12 was exported with
  #   APPLE_TEAM_ID             the 10-character team id (the cert's OU field —
  #                             shells/tvos/scripts/lib.sh derives it the same
  #                             way for a local device build)
  #   ASC_KEY_ID                App Store Connect API key id
  #   ASC_ISSUER_ID             that key's issuer id
  #   ASC_KEY_P8_B64            base64 of the key's .p8. The key needs App
  #                             Manager or Admin: -allowProvisioningUpdates
  #                             CREATES the two distribution profiles with it
  #                             (games.couchpad.tinytrack and .topshelf), which
  #                             is why no profile is stored as a secret — a
  #                             stored one expires annually and fails silently.
  tvos:
    runs-on: macos-latest
    # A cache miss means building Filament for two tvOS SDKs plus the partial
    # desktop build it needs for matc. The cap is the job limit, not an
    # estimate: a hit finishes in minutes.
    timeout-minutes: 360
    env:
      ARCHIVE: ${{ github.workspace }}/build/TinyTrackParty.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/export
      IPA: ${{ github.workspace }}/build/export/TinyTrackParty.ipa
    steps:
      - uses: actions/checkout@v6

      - name: Read the Filament pin
        id: pin
        run: |
          set -eu
          . native/filament.pin
          echo "commit=$FILAMENT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "remote=$FILAMENT_REMOTE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          # Only the two staging generators need Node, and they import node:
          # builtins plus this repo's own ESM — there is no npm ci here.
          node-version: 26

      # ffmpeg IS REQUIRED HERE, unlike on the PR leg. stage-assets.sh transcodes
      # the Ogg engine loop to PCM WAV because no Apple platform decodes Vorbis,
      # and WITHOUT ffmpeg it warns and stages nothing — a build that ships with a
      # silent engine voice and no error anywhere. The check after staging is what
      # turns that fallback into a failure on this leg only.
      - name: Install the build tools
        run: |
          set -eu
          for f in ninja xcodegen ffmpeg; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done

      - name: Fetch the pinned Filament fork
        run: |
          set -eu
          SRC="$RUNNER_TEMP/filament"
          mkdir -p "$SRC"
          git -C "$SRC" init -q
          git -C "$SRC" remote add origin "${{ steps.pin.outputs.remote }}"
          git -C "$SRC" fetch -q --depth 1 origin "${{ steps.pin.outputs.commit }}"
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          echo "FILAMENT_SRC=$SRC" >> "$GITHUB_ENV"

      # Keyed and pathed identically to .github/workflows/tvos.yml, which is what
      # makes that leg the cache warmer for this one. Read its notes before
      # changing either: the install trees only (never out/cmake-tvos-*, whose
      # CMakeCache would trip require_local_install), and no restore-keys.
      - name: Restore the Filament tvOS SDK
        id: filament-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/filament/out/tvos-release/filament-appletvos
            ${{ runner.temp }}/filament/out/tvos-release/filament-appletvsimulator
            ${{ runner.temp }}/filament/out/cmake-release/tools/matc/matc
          key: filament-tvos-${{ steps.pin.outputs.commit }}

      - name: Build the Filament tvOS SDK (pin bump only)
        if: steps.filament-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/filament
        run: |
          set -eu
          ./build.sh -s -i -p tvos release
          for sdk in appletvos appletvsimulator; do
            cmake --install "out/cmake-tvos-release-arm64-$sdk" \
              --prefix "out/tvos-release/filament-$sdk"
            test -f "out/tvos-release/filament-$sdk/include/filament/Engine.h"
          done
          test -x out/cmake-release/tools/matc/matc

      # Directly after the build, not in a post step: everything below can fail
      # for reasons that have nothing to do with Filament, and a missing secret
      # is enough. The Android job lost a completed hour-long build that way.
      - name: Save the Filament tvOS SDK
        if: steps.filament-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/filament/out/tvos-release/filament-appletvos
            ${{ runner.temp }}/filament/out/tvos-release/filament-appletvsimulator
            ${{ runner.temp }}/filament/out/cmake-release/tools/matc/matc
          key: filament-tvos-${{ steps.pin.outputs.commit }}

      # A THROWAWAY KEYCHAIN, deleted in the always() step at the bottom. The
      # import needs -T for each tool allowed to use the key AND the partition
      # list set afterwards, or codesign blocks on a UI prompt that no runner can
      # answer and the job hangs until its timeout.
      #
      # The .p8 goes to ~/.appstoreconnect/private_keys/AuthKey_<id>.p8 because
      # that is one of the four locations altool searches by name; there is no
      # flag that takes a path.
      #
      # The preflight loop is the Android job's, for the same reason: an empty
      # secret otherwise fails deep inside xcodebuild with a signing error that
      # reads like a project defect.
      - name: Materialize the signing identity from secrets
        env:
          APPLE_DIST_CERT_P12_B64: ${{ secrets.APPLE_DIST_CERT_P12_B64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -eu
          for v in APPLE_DIST_CERT_P12_B64 APPLE_DIST_CERT_PASSWORD APPLE_TEAM_ID \
                   ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64; do
            if [ -z "$(eval "echo \"\$$v\"")" ]; then
              echo "::error::secret $v is not set"
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_DIST_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$APPLE_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # APPEND to the search list rather than replacing it: xcodebuild also
          # reads the login keychain for Apple's intermediate certificates, and a
          # bare `-s "$KEYCHAIN"` drops them ("no signing certificate found").
          # The unquoted substitution is the point — the existing list is several
          # paths and each has to arrive as its own argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          KEYDIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYDIR"
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$KEYDIR/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$KEYDIR/AuthKey_$ASC_KEY_ID.p8"

          {
            echo "KEYCHAIN=$KEYCHAIN"
            echo "ASC_KEY_PATH=$KEYDIR/AuthKey_$ASC_KEY_ID.p8"
            echo "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      # Engine (device slice), Metal materials, staged bundle, xcodegen. NOT
      # build.sh — that one owns its own xcodebuild with a `build` verb, and this
      # job needs `archive`. prepare.sh is the split that exists for exactly this.
      - name: Prepare the app (engine, materials, bundle, project)
        run: shells/tvos/scripts/prepare.sh device

      # THE ffmpeg FALLBACK'S GUARD RAIL, and the counterpart of the Android
      # job's signature check: stage-assets.sh is deliberately tolerant of a
      # missing transcoder so a fresh worktree still builds, and on this one leg
      # that tolerance would ship a game whose cars make no sound.
      - name: The engine voice must be in the bundle
        run: |
          set -eu
          f=shells/tvos/Generated/assets/audio/engine_loop.wav
          [ -s "$f" ] || { echo "::error::$f is missing — ffmpeg did not run"; exit 1; }

      # ONE BUILD NUMBER PER RUN, and both targets take it: project.yml reads
      # CURRENT_PROJECT_VERSION into the app's CFBundleVersion and the Top Shelf
      # appex's alike, because App Store Connect rejects an extension that
      # disagrees with its host.
      #
      # THIS IS NOT RE-RUNNABLE, the same trap the Play upload has:
      # GITHUB_RUN_NUMBER does not change on a re-run, so a second attempt
      # presents a build number the store has already seen. Recover by moving the
      # tag, not by pressing re-run.
      #
      # A tag build takes its MARKETING_VERSION from the tag; a dispatch keeps
      # project.yml's default. Both are command-line overrides — the values in
      # the spec stay put.
      - name: Archive
        run: |
          set -eu
          ARGS=(-project shells/tvos/TinyTrackParty.xcodeproj -scheme TinyTrackParty
                -destination 'generic/platform=tvOS' -archivePath "$ARCHIVE"
                -allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "${{ secrets.ASC_KEY_ID }}"
                -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
                "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM"
                "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ARGS+=("MARKETING_VERSION=$GITHUB_REF_NAME")
          fi
          xcodebuild "${ARGS[@]}" archive

      # method: app-store-connect is the Xcode 15.3+ name for what used to be
      # `app-store`. destination stays `export` — the .ipa is uploaded by the
      # explicit altool step below rather than by xcodebuild, so that a
      # validation failure and an upload failure are two different red steps.
      #
      # Generated rather than checked in: the only thing in it that varies is the
      # team id, and a committed copy would be a second source for it.
      - name: Export the .ipa
        run: |
          set -eu
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          ls -l "$EXPORT_DIR"

      # BEFORE the upload, and on every run including a dispatch. Store-side
      # rejections (ITMS-*) are the ones that cost a tag, and validation reports
      # them while the artifact is still only an artifact.
      - name: Validate with App Store Connect
        run: |
          set -eu
          xcrun altool --validate-app -f "$IPA" -t tvos \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      # Before publishing, so an upload rejection still leaves the build
      # downloadable from the run.
      - name: Upload the .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinytrack-tvos-ipa
          path: ${{ env.IPA }}
          if-no-files-found: error

      # TAGS ONLY, for the reason the Play steps give: a dispatch is a build —
      # the end-to-end test and the cache warmer — and a build is not a release.
      # An accepted upload processes for a few minutes and is then live to
      # internal TestFlight testers with no further step here.
      - name: Upload to App Store Connect
        if: github.ref_type == 'tag'
        run: |
          set -eu
          xcrun altool --upload-app -f "$IPA" -t tvos \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      # always(), because a failed run that leaves a certificate and an API key
      # on the runner is the one outcome worth preventing unconditionally.
      - name: Remove the signing identity
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys"/AuthKey_*.p8
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true

  # THE STORE PICTURES, and they come from the WEB display rather than from a
  # television. That is not a shortcut around a hard problem, it is the only
  # place a runner can render this at all: shells/androidtv's own harness
  # photographs an installed app with `adb exec-out screencap`, and a runner has
  # no box and no emulator that could run an arm64-only APK. What it renders is
  # the same C++ engine and the same Filament renderer the TV runs, from the
  # same scenario table (public/shared/galleryScenarios.js), so the pixels are
  # the game rather than a mock-up of it.
  #
  # capture-artwork.js, NOT capture-shots.mjs. The gallery harness writes WebP at
  # 1280 wide, which Play does not accept, and it shoots under
  # navigator.webdriver, where Stage caps the render scale at 0.25 and Display
  # skips the sun's shadow bake. capture-artwork spoofs that flag false, so these
  # come out at full scale WITH shadows -- which is the difference between a
  # store listing and a bug report.
  #
  # 1920x1080 PNG serves every Play screenshot slot: 16:9 is inside the aspect
  # range phone and tablet accept and is exactly what the TV slot wants, so one
  # set is uploaded to all of them.
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Chromium only. The engine is the COMMITTED wasm under
      # public/display/engine/native/, so nothing here builds native code and
      # this job has no Filament dependency at all.
      - run: npx playwright install --with-deps chromium

      # One line per shot: scenario, track, players. The spread is deliberate --
      # five cups means five looks, and a listing that shows one of them sells a
      # much smaller game than this is. The last three leave the track unset and
      # so land on capture-artwork's own default, `ribbon`: nothing scenario-side
      # picks a track, so an unset one is the script's constant rather than a
      # choice about the moment. A track id that is not in the catalogue is NOT
      # an error either -- main.js falls back to the first one and would quietly
      # shoot a different scene than the line asks for.
      #
      # --ss 1 (no supersampling): the renderer goes through SwiftShader here,
      # and a 4K frame to downscale costs minutes rather than seconds. FXAA is
      # on, so the edges hold up.
      - name: Capture
        run: |
          set -eu
          mkdir -p store-shots
          # An ARRAY, not a ${3:+--track "$3"} conditional expansion. That
          # shorthand is one word under zsh and two under bash, and
          # capture-artwork.js parses argv positionally and IGNORES a flag it
          # cannot read -- so the one-word form silently ate the --out that
          # followed it and wrote the default path instead. It failed by
          # producing the wrong FILE, never by exiting non-zero.
          shoot() {
            local name=$1 scenario=$2 track=$3 players=$4
            local a=(--scenario "$scenario" --players "$players" --ss 1
                     --out "store-shots/$name.png")
            [ -n "$track" ] && a+=(--track "$track")
            echo "::group::$name"
            node scripts/capture-artwork.js "${a[@]}"
            echo "::endgroup::"
            # Same reason: prove the file the flag asked for actually exists.
            [ -f "store-shots/$name.png" ] || {
              echo "::error::$name did not write store-shots/$name.png"
              exit 1
            }
          }
          shoot 1-beach-4p     racing   tidepool 4
          shoot 2-snow-2p      racing   glacier  2
          shoot 3-backyard-4p  racing   pretzel  4
          shoot 4-canyon-solo  racing   crag     1
          shoot 5-rooftop-4p   racing   skyline  4
          shoot 6-rocket       rocket   ""       4
          shoot 7-countdown    countdown ""      4
          shoot 8-monster      monster  ""       4
          ls -l store-shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tinytrack-store-screenshots
          path: store-shots/*.png
          if-no-files-found: error
