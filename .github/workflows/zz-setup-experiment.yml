name: zz-setup-experiment

# TEMPORARY. Measures four ways of getting a runner ready to run Playwright, so
# the e2e job's ~25-40 s "Initialize containers" can be replaced on evidence
# rather than on a guess. Each variant does its full setup and then runs ONE
# cheap spec, to prove the setup actually works and not just that it was fast.
# Delete once the winner is applied to test.yml.

on:
  push:
    branches: ['ci-performance']
    paths: ['.github/workflows/zz-setup-experiment.yml']
  workflow_dispatch:

jobs:
  # A — what we ship today: the 922 MB official image, plus a different Node on top.
  a-container-setupnode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npx playwright test device-chooser

  # B — same image, but trust the Node it already ships instead of installing one.
  b-container-imagenode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
      - run: node --version
      - run: npm ci
      - run: npx playwright test device-chooser

  # C — no container: cache the browser binaries, apt the system deps.
  c-cached-withdeps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-1.60.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test device-chooser

  # D — as C, but betting the runner image already carries chromium's libs, so
  # the apt step can go entirely. The cheapest option IF chromium still launches.
  d-cached-nodeps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-1.60.0
      - run: npx playwright install chromium
      - run: npx playwright test device-chooser
