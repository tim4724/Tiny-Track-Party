# The check that audits the SUITE rather than the code. It is slow and does not belong
# on a PR — it answers a question that only goes stale over weeks:
#
#   mutation-check   Can the conformance gates still fail? Breaks the engine dozens
#                    of ways and requires the matching ctest to go red for each. Two
#                    gates in this tree were already found blind this way.
#
# Weekly, plus on demand. A failure here is never a broken build — it is a broken
# ability to detect broken builds, which is worth a human deciding what to do about.
name: test the tests

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays, 05:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'mutation-check --only=<substring> (blank runs the full set)'
        required: false
        default: ''

concurrency:
  group: test-the-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: Break the engine on purpose, dozens of ways
        run: node scripts/mutation-check.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
      - name: The tree must be pristine afterwards
        # The script restores in a finally and rebuilds to prove it, but a harness that
        # vandalises the tree has to be held to this from the outside too.
        run: git diff --exit-code
