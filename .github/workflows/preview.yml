name: Preview Deploy

on:
  push:
    branches:
      - '**'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/docker-publish.yml
    with:
      platforms: ${{ github.ref_name == 'main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  deploy:
    runs-on: [self-hosted, k8s]
    needs: build
    if: github.actor != 'dependabot[bot]'
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.30.0

      - name: Write kubeconfig
        run: |
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      - name: Deploy preview to Kubernetes
        env:
          BRANCH_RAW: ${{ github.ref_name }}
          IMAGE: ${{ needs.build.outputs.sha_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SAFE_BRANCH=$(echo "$BRANCH_RAW" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9-]#-#g' | cut -c1-50 | sed 's/-*$//')
          NS="tinytrack-${SAFE_BRANCH}"
          # All preview hosts sit under *.couchpad.games (covered by the
          # existing wildcard TLS + DNS). main deploys to tinytrack-main,
          # branches to tinytrack-<branch>.
          HOST="tinytrack-${SAFE_BRANCH}.couchpad.games"

          kubectl get ns "$NS" >/dev/null 2>&1 || kubectl create ns "$NS"

          # What is serving right now, for the rollback step below. Read it before
          # the apply overwrites it, and note the deployer SA can `get` and `patch`
          # deployments but NOT list replicasets, so `kubectl rollout undo` is not
          # available to us: rolling the image back by name is. Empty on a
          # namespace's first deploy, which the rollback step treats as "nothing to
          # go back to".
          PREV_IMAGE=$(kubectl get deployment tinytrack -n "$NS" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          echo "PREV_IMAGE=${PREV_IMAGE}" >> "$GITHUB_ENV"

          # Grant deployer SA namespace-scoped permissions via RoleBinding.
          cat <<RBAC | kubectl apply -n "$NS" -f -
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: tinytrack-deployer
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: tinytrack-preview-resources
          subjects:
          - kind: ServiceAccount
            name: tinytrack-deployer
            namespace: github-runner
          RBAC

          # Network policies: default-deny + allow DNS + allow traefik ingress.
          cat <<NETPOL | kubectl apply -n "$NS" -f -
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: default-deny-all
          spec:
            podSelector: {}
            policyTypes:
            - Ingress
            - Egress
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-dns
          spec:
            podSelector: {}
            policyTypes:
            - Egress
            egress:
            - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
              ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-ingress-from-traefik
          spec:
            podSelector: {}
            policyTypes:
            - Ingress
            ingress:
            - from:
              - ipBlock:
                  cidr: 192.168.1.115/32
              ports:
              - protocol: TCP
          NETPOL

          # Copy the *.couchpad.games wildcard TLS into the preview namespace.
          TLS_CRT=$(kubectl get secret couchpad-wildcard-tls -n default -o jsonpath='{.data.tls\.crt}')
          TLS_KEY=$(kubectl get secret couchpad-wildcard-tls -n default -o jsonpath='{.data.tls\.key}')

          cat <<EOS | kubectl apply -n "$NS" -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: couchpad-wildcard-tls
          type: kubernetes.io/tls
          data:
            tls.crt: ${TLS_CRT}
            tls.key: ${TLS_KEY}
          EOS

          cat <<EOF | kubectl apply -n "$NS" -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: tinytrack
          spec:
            revisionHistoryLimit: 3
            replicas: 1
            # Pinned, not left to the 25% default: with the readinessProbe below
            # this is what keeps the old pod serving through a deploy that cannot
            # boot, instead of taking the host down with it.
            strategy:
              rollingUpdate:
                maxUnavailable: 0
            selector:
              matchLabels:
                app: tinytrack
            template:
              metadata:
                labels:
                  app: tinytrack
              spec:
                containers:
                  - name: tinytrack
                    image: ${IMAGE}
                    env:
                      - name: BASE_URL
                        value: https://${HOST}
                      - name: APP_ENV
                        value: preview
                      - name: GIT_SHA
                        value: ${GIT_SHA}
                    ports:
                      - containerPort: 4000
                        name: http
                    # Without this the container counts as Ready the instant it
                    # starts, so `rollout status` below greenlights a server that
                    # dies a second later. The Service then loses its only ready
                    # endpoint, traefik drops the route, and the host serves a
                    # bare 404 while CI reports a green deploy.
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 4000
                      periodSeconds: 5
                      failureThreshold: 3
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: tinytrack
          spec:
            selector:
              app: tinytrack
            ports:
              - port: 4000
                targetPort: 4000
          ---
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: redirect-to-https
          spec:
            redirectScheme:
              scheme: https
              permanent: true
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: tinytrack-https
          spec:
            entryPoints:
              - websecure
            routes:
              - match: Host(\`${HOST}\`)
                kind: Rule
                services:
                  - name: tinytrack
                    port: 4000
            tls:
              secretName: couchpad-wildcard-tls
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: tinytrack-http
          spec:
            entryPoints:
              - web
            routes:
              - match: Host(\`${HOST}\`)
                kind: Rule
                services:
                  - name: tinytrack
                    port: 4000
                middlewares:
                  - name: redirect-to-https
          EOF

          # Green job = new pod live. Without this, apply returns before the
          # image is even pulled, and a crash-looping pod still reads as a
          # successful deploy (same pattern as HexStacker's production deploy).
          kubectl rollout status deployment/tinytrack -n "$NS" --timeout=180s

      # The readinessProbe keeps a broken image from ever going live, so the old pod
      # is still serving when we get here. Put the spec back on the image it was
      # serving anyway: otherwise the namespace is left half rolled out, with a
      # crash-looping surge pod burning restarts until someone notices. The job stays
      # failed either way, so nothing here may mask the error that got us here.
      - name: Roll back to the previously serving image
        if: failure()
        env:
          BRANCH_RAW: ${{ github.ref_name }}
          IMAGE: ${{ needs.build.outputs.sha_tag }}
        run: |
          SAFE_BRANCH=$(echo "$BRANCH_RAW" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9-]#-#g' | cut -c1-50 | sed 's/-*$//')
          NS="tinytrack-${SAFE_BRANCH}"
          if [ -z "${PREV_IMAGE:-}" ]; then
            echo "No previously serving image (first deploy to $NS, or the deploy failed before it could be read). Nothing to roll back."
            exit 0
          fi
          if [ "$PREV_IMAGE" = "$IMAGE" ]; then
            echo "Already on $PREV_IMAGE. Nothing to roll back."
            exit 0
          fi
          echo "Rolling $NS back: $IMAGE -> $PREV_IMAGE"
          kubectl set image deployment/tinytrack tinytrack="$PREV_IMAGE" -n "$NS" || true
          kubectl rollout status deployment/tinytrack -n "$NS" --timeout=120s || true
          {
            echo "### Deploy failed, rolled back"
            echo "- Attempted: \`${IMAGE}\`"
            echo "- Restored: \`${PREV_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview URL
        env:
          BRANCH_RAW: ${{ github.ref_name }}
        run: |
          SAFE_BRANCH=$(echo "$BRANCH_RAW" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9-]#-#g' | cut -c1-50 | sed 's/-*$//')
          HOST="tinytrack-${SAFE_BRANCH}.couchpad.games"
          {
            echo "### Preview"
            echo "- URL: https://${HOST}"
          } >> "$GITHUB_STEP_SUMMARY"
