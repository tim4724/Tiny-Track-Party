name: Docker Image

# The branch previews' image (preview.yml). main deploys to Hetzner without one
# (hetzner-deploy.yml).
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      sha_tag:
        description: "Image tag for this commit (sha)"
        value: ${{ jobs.build.outputs.sha_tag }}

env:
  REGISTRY: ghcr.io

# Jobs that need more say so themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.out.outputs.sha_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min: the final image's layers only. mode=max also kept the
          # build stage's copy of public/, assets and all, which changes on
          # every push and which a hit saves seconds on. Those blobs kept the
          # repository at its Actions cache limit, where GitHub evicts
          # whatever was read longest ago: the Filament SDKs (native.yml,
          # tvos.yml), read only when native/ changes and the slowest builds
          # CI has.
          cache-to: type=gha,mode=min
          # The preview cluster is amd64.
          platforms: linux/amd64
          # The commit the pages name (see the Dockerfile).
          build-args: GIT_SHA=${{ github.sha }}

      # The sha tag is the one preview.yml deploys: it names this exact commit's
      # image even once the branch tag has moved on.
      - name: Capture tag for output
        id: out
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "sha_tag=$(printf '%s' "$TAGS" | tr ',' '\n' | grep ':sha-' | head -n1)" >> "$GITHUB_OUTPUT"

      # Apache's own answer, before preview.yml rolls the image out: the E2E
      # suite reads the caching rules as text, and only Apache can say whether
      # public/.htaccess means what it reads as.
      - name: Check the image's cache headers
        env:
          IMAGE: ${{ steps.out.outputs.sha_tag }}
        run: |
          set -euo pipefail
          docker run -d -p 4000:4000 "$IMAGE"
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:4000/health
          PAGE=$(curl -fsS http://localhost:4000/)
          # The bundle the page names is kept for good; its source never is.
          BUNDLE=$(grep -o '/bundle/display\.[^"]*' <<< "$PAGE")
          curl -fsSI "http://localhost:4000$BUNDLE" | grep -qi '^cache-control:.*immutable'
          curl -fsSI http://localhost:4000/display/main.js | grep -qi '^cache-control:.*no-store'
