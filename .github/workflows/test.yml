name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Plain reproducibility pin. Golden traces no longer depend on the
          # Node major: sim transcendentals go through engine/math.js
          # (fdlibm WASM), so fixtures replay bit-exactly on any Node/arch.
          node-version: 26
          cache: 'npm'
      - run: npm ci
      # Gates on errors only; no-unused-vars / style rules are warnings and
      # do not fail the build (see eslint.config.mjs).
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Plain reproducibility pin. Golden traces no longer depend on the
          # Node major: sim transcendentals go through engine/math.js
          # (fdlibm WASM), so fixtures replay bit-exactly on any Node/arch.
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # SHARDED across runners, which is not the same knob as playwright's `workers`.
  # The runner has no GPU, so every display page rasterizes a full Filament scene
  # through SwiftShader — that is why the config pins workers: 1 (parallel
  # displays on ONE machine just starve each other). Separate runners don't
  # share that contention, so this is the only axis the suite can scale on.
  #
  # It became necessary when the native renderer replaced Three.js: same 24
  # specs, but ~2x the software-rasterized work per test, and the serial job
  # ran ~20 min against a 10-minute cap.
  e2e:
    runs-on: ubuntu-latest
    # Six, measured against four on the real thing rather than reasoned about:
    # 1m40s vs 2m01s for the whole workflow. Both were tried in anger, because
    # once the automation render budget landed and whole-suite execution fell
    # from 903 s to 219 s, the old arithmetic no longer applied.
    #
    # Do not "optimise" this down to save runners. The repo is PUBLIC, so
    # standard-runner minutes are free, and wall clock is the only axis that
    # pays. What DOES cap it is the ~60-70 s every shard spends before a test
    # runs (container pull 25-40 s, checkout, setup-node): at six the slowest
    # shard was 96 s with just 35 s of tests in it, so the suite is no longer
    # what this workflow is waiting on. That floor is why eight would buy ~10 s
    # at most, and why the honest next move — if this ever matters again — is a
    # slimmer image, not more shards.
    #
    # Per-test sharding (fullyParallel in playwright.config.js) is what makes any
    # of these splits even; by FILE, cup-series alone would pin one shard.
    #
    # 10 covers the slowest shard plus the retry the config arms, with room for a
    # cold-cache run, and still trips on a genuine hang.
    timeout-minutes: 10
    strategy:
      fail-fast: false   # one shard's failure shouldn't hide the others' results
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      # Ships the matching browsers — keep the tag in sync with
      # @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Plain reproducibility pin. Golden traces no longer depend on the
          # Node major: sim transcendentals go through engine/math.js
          # (fdlibm WASM), so fixtures replay bit-exactly on any Node/arch.
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - name: Run E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/6
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Unique per shard — upload-artifact@v4 rejects a duplicate name.
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
