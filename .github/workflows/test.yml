name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Jobs that need more say so themselves.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # No sim or track number depends on the Node major: they are produced
          # inside the wasm, which vendors its own fdlibm. The tests do: they
          # import() the browser's ESM .js files from a CommonJS package, which
          # only Node's module-syntax detection allows, and old Nodes lack it.
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      # Gates on errors only; no-unused-vars / style rules are warnings and
      # do not fail the build (see eslint.config.mjs).
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    # A cold checkout has been observed to take 2m+ on GitHub's side — a
    # 5-minute budget had zero headroom and flaked on exactly that.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # No sim or track number depends on the Node major: they are produced
          # inside the wasm, which vendors its own fdlibm. The tests do: they
          # import() the browser's ESM .js files from a CommonJS package, which
          # only Node's module-syntax detection allows, and old Nodes lack it.
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # SHARDED across runners, which is not the same knob as playwright's `workers`.
  # The runner has no GPU, so every display page rasterizes a full Filament scene
  # through SwiftShader — that is why the config pins workers: 1 (parallel
  # displays on ONE machine just starve each other). Separate runners don't
  # share that contention, so this is the only axis the suite can scale on.
  #
  # It became necessary when the native renderer replaced Three.js: same 24
  # specs, but ~2x the software-rasterized work per test, and the serial job
  # ran ~20 min against a 10-minute cap.
  e2e:
    needs: e2e-plan
    runs-on: ubuntu-latest
    # Six, measured against four on the real thing rather than reasoned about:
    # 1m40s vs 2m01s for the whole workflow. Both were tried in anger, because
    # once the automation render budget landed and whole-suite execution fell
    # from 903 s to 219 s, the old arithmetic no longer applied.
    #
    # Do not "optimise" this down to save runners. The repo is PUBLIC, so
    # standard-runner minutes are free, and wall clock is the only axis that
    # pays.
    #
    # scripts/e2e-shard.mjs deals the tests out by how long each took (see
    # e2e-plan) rather than using --shard, whose contiguous blocks put every
    # slow gallery spec in one shard and made it run several times longer than
    # the rest.
    #
    # 10 covered the slowest shard plus the retry the config arms, with room for
    # a cold-cache run, and still tripped on a genuine hang. What it did NOT
    # cover was setup going wrong: `--with-deps` shells out to apt, and a slow
    # mirror stalled it past the whole budget three times in one afternoon — the
    # job was cancelled mid-download having run ZERO tests, and the only
    # published signal was a red X on a green suite. So the budget is now split:
    # the install step has its own cap below (it fails FAST and says what it was
    # doing), and this covers that plus the 10 the tests actually want.
    strategy:
      fail-fast: false   # one shard's failure shouldn't hide the others' results
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # NO `container:`. This job used to run in mcr.microsoft.com/playwright,
    # which is 922 MB and was re-pulled by every shard on every run — 25-40 s
    # before a single test started, and then a different Node was installed on
    # top of the one it ships anyway. Caching just the browser binaries does
    # the same job in ~4 s. Measured, four variants, warm cache:
    #   container + setup-node (what this was)   50 s
    #   container, image's own node              40 s
    #   cached browsers + `install --with-deps`  35 s
    #   cached browsers, no --with-deps          30 s
    #
    # No --with-deps: chromium's shared libraries are already on the
    # ubuntu-latest image (that variant ran the full 3D scene boot through
    # SwiftShader on a stock runner). WEBKIT's are not, and apt is the step that
    # stalls, so the one WebKit spec runs in its own job (e2e-webkit, below)
    # and these shards never touch apt. While every shard installed WebKit in
    # case it drew that spec, a slow mirror failed main three runs in a row.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # No sim or track number depends on the Node major: they are produced
          # inside the wasm, which vendors its own fdlibm. The tests do: they
          # import() the browser's ESM .js files from a CommonJS package, which
          # only Node's module-syntax detection allows, and old Nodes lack it.
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Name the runner image
        # The browser builds are per distro release but Playwright's cache dir
        # is not, so a cache restored from another image is taken as installed
        # and the browser then fails to load its libraries. ImageOS (ubuntu24,
        # ubuntu26) is only in the shell environment, not the env context.
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, so bumping @playwright/test invalidates it
          # automatically, and on the runner image (see above). The
          # prefix restore-key means a miss still starts from the last browser
          # set and only downloads the delta.
          # The browser is in the key because e2e-webkit caches a different set.
          key: pw-chromium-${{ steps.image.outputs.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-chromium-${{ steps.image.outputs.os }}-
      - name: Install Playwright browsers
        # Its OWN cap, so a stalled download cannot spend the tests' time. Four
        # minutes is generous against a warm cache (~4 s) and a cold browser
        # download. Failing here names the step, which a job-level cancellation
        # did not.
        timeout-minutes: 4
        run: npx playwright install chromium
      - name: Run E2E tests
        env:
          E2E_DURATIONS: ${{ needs.e2e-plan.outputs.durations }}
        # --grep matches the file name too; e2e-webkit runs that spec.
        run: node scripts/e2e-shard.mjs ${{ matrix.shard }}/6 --grep-invert webkit-controller-layout
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Unique per shard — upload-artifact rejects a duplicate name.
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
      # What e2e-durations makes the next table from. Main only, as that is.
      - name: Upload the shard's report
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: test-results/e2e-report.json
          retention-days: 1
          if-no-files-found: error

  # THE DURATION TABLE the shards deal by, read ONCE here and handed to all six,
  # because each shard computes the deal on its own, and two shards dealing from
  # different tables can each leave out a test the other took, and stay green. A
  # cache restored per shard can change between two shards' restores, whenever
  # a main run saves a newer one, so the shards must not restore it themselves.
  # This hop costs the shards a few seconds of start; the deal saves far more
  # on the slowest shard than that.
  #
  # The table is CI's own: e2e-durations saves a fresh one from every green run
  # on main, and caches written on main are what every branch restores. No
  # table (the first run, or the cache evicted) is a warning, and the shards
  # deal with every test weighing the same.
  e2e-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      durations: ${{ steps.table.outputs.durations }}
    steps:
      - name: Restore the duration table
        uses: actions/cache/restore@v6
        with:
          path: e2e-durations.json
          # The run's own id never exists yet: this is "the newest table".
          key: e2e-durations-${{ github.run_id }}
          restore-keys: e2e-durations-
      - name: Hand it to the shards
        id: table
        run: |
          if [ -s e2e-durations.json ]; then
            echo "durations=$(jq -c . e2e-durations.json)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no E2E duration table cached; every test weighs the same"
            echo "durations={}" >> "$GITHUB_OUTPUT"
          fi

  # The next table, from this run's six reports. Main only, and only from a
  # GREEN run, so it always covers the whole suite and no test that has since
  # been deleted lingers in it. A new key per run (cache keys cannot be
  # overwritten); the old ones go unread and GitHub drops them within the week.
  # A failed save must not turn the run red: hetzner-deploy waits on it.
  e2e-durations:
    needs: e2e
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-*
          path: reports
      # The runner's own Node: the script imports node: builtins only.
      - name: Make the table
        run: node scripts/e2e-shard.mjs --durations reports/*/e2e-report.json > e2e-durations.json
      - name: Save the table
        uses: actions/cache/save@v6
        with:
          path: e2e-durations.json
          key: e2e-durations-${{ github.run_id }}-${{ github.run_attempt }}

  # The one spec that opens WEBKIT (tests/CLAUDE.md says why). It is DOM-only,
  # so it is quick, but WebKit's system libraries are not on the stock image and
  # only apt installs them. Keeping that here means a slow mirror reddens this
  # one job, named, instead of whichever shards happened to be installing.
  e2e-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # No sim or track number depends on the Node major: they are produced
          # inside the wasm, which vendors its own fdlibm. The tests do: they
          # import() the browser's ESM .js files from a CommonJS package, which
          # only Node's module-syntax detection allows, and old Nodes lack it.
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Name the runner image
        # As in e2e: the image is in the key.
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-webkit-${{ steps.image.outputs.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-webkit-${{ steps.image.outputs.os }}-
      - name: Install Playwright browsers
        # Its own cap, as in e2e: past four minutes the mirror is not coming
        # back, and a re-run is cheaper than the wait.
        timeout-minutes: 4
        run: npx playwright install --with-deps webkit
      - name: Run E2E tests
        run: npx playwright test tests/e2e/webkit-controller-layout.spec.js
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-webkit
          path: test-results/
          retention-days: 7
