name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Plain reproducibility pin. Golden traces no longer depend on the
          # Node major: sim transcendentals go through engine/math.js
          # (fdlibm WASM), so fixtures replay bit-exactly on any Node/arch.
          node-version: 26
          cache: 'npm'
      - run: npm ci
      # Gates on errors only; no-unused-vars / style rules are warnings and
      # do not fail the build (see eslint.config.mjs).
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Plain reproducibility pin. Golden traces no longer depend on the
          # Node major: sim transcendentals go through engine/math.js
          # (fdlibm WASM), so fixtures replay bit-exactly on any Node/arch.
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Ships the matching browsers — keep the tag in sync with
      # @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Plain reproducibility pin. Golden traces no longer depend on the
          # Node major: sim transcendentals go through engine/math.js
          # (fdlibm WASM), so fixtures replay bit-exactly on any Node/arch.
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
