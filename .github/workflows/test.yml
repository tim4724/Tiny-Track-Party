name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Plain reproducibility pin. Golden traces no longer depend on the
          # Node major: sim transcendentals go through engine/math.js
          # (fdlibm WASM), so fixtures replay bit-exactly on any Node/arch.
          node-version: 26
          cache: 'npm'
      - run: npm ci
      # Gates on errors only; no-unused-vars / style rules are warnings and
      # do not fail the build (see eslint.config.mjs).
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Plain reproducibility pin. Golden traces no longer depend on the
          # Node major: sim transcendentals go through engine/math.js
          # (fdlibm WASM), so fixtures replay bit-exactly on any Node/arch.
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # SHARDED across runners, which is not the same knob as playwright's `workers`.
  # The runner has no GPU, so every display page rasterizes a full Filament scene
  # through SwiftShader — that is why the config pins workers: 1 (parallel
  # displays on ONE machine just starve each other). Separate runners don't
  # share that contention, so this is the only axis the suite can scale on.
  #
  # It became necessary when the native renderer replaced Three.js: same 24
  # specs, but ~2x the software-rasterized work per test, and the serial job
  # ran ~20 min against a 10-minute cap.
  e2e:
    runs-on: ubuntu-latest
    # Four, because a shard's ~30-40 s of fixed overhead (mostly the playwright
    # container pull) is now the BIGGER half of it. Once the automation render
    # budget landed, whole-suite execution fell from 903 s to 219 s, so the
    # arithmetic that once justified more runners inverted: measured at six
    # shards the slowest was 96 s, of which only 35 s was tests. Four splits the
    # same 219 s into ~55 s pieces and lands within ~10 s of that, for two fewer
    # runners. Going the other way is equally pointless — the floor here is the
    # container pull, not the suite.
    #
    # Per-test sharding (fullyParallel in playwright.config.js) is what makes any
    # of these splits even; by FILE, cup-series alone would pin one shard.
    #
    # 10 covers the slowest shard plus the retry the config arms, with room for a
    # cold-cache run, and still trips on a genuine hang.
    timeout-minutes: 10
    strategy:
      fail-fast: false   # one shard's failure shouldn't hide the others' results
      matrix:
        shard: [1, 2, 3, 4]
    container:
      # Ships the matching browsers — keep the tag in sync with
      # @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Plain reproducibility pin. Golden traces no longer depend on the
          # Node major: sim transcendentals go through engine/math.js
          # (fdlibm WASM), so fixtures replay bit-exactly on any Node/arch.
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - name: Run E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Unique per shard — upload-artifact@v4 rejects a duplicate name.
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
