name: Record golden-trace fixtures

# Cross-platform re-record check: traces are platform-independent (sim
# transcendentals go through engine/math.js, fdlibm WASM), so re-recording
# the fixture set HERE (ubuntu x64) must reproduce the committed fixtures
# (recorded on any dev machine) byte for byte — the diff step is the proof.
# If it fails, either determinism regressed (investigate before anything
# else) or the committed fixtures are stale (re-record locally and commit).
# The artifact remains available as a convenience.

on:
  workflow_dispatch:
  # workflow_dispatch only resolves once this file is on the default branch,
  # and a change to the recording tooling is exactly when a re-record is
  # wanted anyway — so also run when the tooling itself changes.
  push:
    paths:
      - '.github/workflows/record-traces.yml'
      - 'scripts/record-fixtures.mjs'
      - 'scripts/record-trace.mjs'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Keep in sync with test.yml (plain reproducibility pin; traces
          # no longer depend on the Node major).
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: node scripts/record-fixtures.mjs
      - name: Re-record is byte-identical to the committed fixtures (platform independence)
        run: git diff --exit-code --stat tests/fixtures/traces
      - name: Fixtures replay on this platform
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: trace-fixtures
          path: tests/fixtures/traces/*.jsonl
          retention-days: 7
