name: Native conformance

# The C++ side of the conformance scheme (Track S). Runs whenever the native
# tree or a shared fixture changes: build with strict FP flags and replay the
# shared corpora/fixtures bit-for-bit on every leg of the platform matrix —
# desktop clang (linux x64 + macOS arm64), emscripten/WASM under Node, the
# tvOS simulator, and an Android NDK cross-compile. Acceptance for Track S
# M4: every fixture byte-exact on every runnable target.

on:
  pull_request:
    paths:
      - 'native/**'
      - 'tests/fixtures/**'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'tests/fixtures/**'
      - '.github/workflows/native.yml'

# NOTE: this workflow absorbed the old record-traces.yml. Its job — re-record the
# golden fixtures on a DIFFERENT machine and prove byte equality — is now the
# record_* ctest entries, which run wherever ctest runs (ubuntu, macOS, wasm/Node)
# instead of on one ubuntu runner, and use the C++ recorder rather than the
# retired JS one.

jobs:
  conformance:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest   # x86-64, clang (match clang flag semantics everywhere)
          - os: macos-latest    # arm64, Apple clang (the -ffp-contract=fast default risk)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Configure (clang, strict FP)
        run: cmake -S native -B native/build/ci -DCMAKE_BUILD_TYPE=Release
        env:
          CC: clang
          CXX: clang++
      - name: Build
        run: cmake --build native/build/ci --parallel
      - name: Corpus + conformance tests
        run: ctest --test-dir native/build/ci --output-on-failure

  wasm:
    # The web leg: the same suite compiled with emscripten runs under Node
    # (NODERAWFS reads the fixtures straight off the checkout). This is the
    # engine build the shipped game will eventually load.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10   # any recent emsdk; wasm f64 semantics are version-independent
      - name: Configure (emscripten)
        run: emcmake cmake -S native -B native/build/wasm -DCMAKE_BUILD_TYPE=Release -DCMAKE_CROSSCOMPILING_EMULATOR=$(which node)
      - name: Build
        run: cmake --build native/build/wasm --parallel
      - name: Corpus + conformance tests (Node)
        run: ctest --test-dir native/build/wasm --output-on-failure
      - name: Link-check the browser module (sim + party, no renderer)
        # ttp_runtime_web is the target the GAME loads, and the only one whose
        # link options differ (no NODERAWFS/EXIT_RUNTIME, KEEPALIVE-driven
        # exports). Nothing else in CI compiles it, so an ABI change that breaks
        # only the browser module would otherwise reach main.
        #
        # This is NOT the shipped artifact. The real one also links
        # libttp-renderer, which needs the Filament fork that this runner does
        # not carry — so without -DFILAMENT_SDK the target builds sim+party
        # only, which is exactly the ABI surface this step exists to check.
        # Whether the CHECKED-IN artifact is current is a separate question,
        # answered by tests/native-artifact.test.js: emcc output is not
        # reproducible across emsdk versions, so it compares a source hash.
        run: cmake --build native/build/wasm --target ttp_runtime_web --parallel

  tvos-sim:
    # The Apple TV leg: cross-compile for the tvOS simulator and run the WHOLE
    # ctest suite on a booted Apple TV 4K, via the simctl-spawn emulator shim —
    # the same shape as the wasm leg running under node. This job used to script
    # `simctl spawn` per binary, which is how it drifted to 12 of 24 tests (no
    # party corpora, no record round-trips) while the docs claimed full coverage.
    # Booting comes FIRST because the UDID is baked in at configure time.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Boot Apple TV simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for k,v in d.items() if 'tvOS' in k for dev in v))")
          xcrun simctl boot "$UDID" || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Configure (tvOS simulator, arm64)
        # MACOSX_BUNDLE=OFF so the test binaries stay plain executables that
        # simctl spawn can launch directly.
        run: |
          cmake -S native -B native/build/tvos-sim -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=tvOS -DCMAKE_OSX_SYSROOT=appletvsimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_MACOSX_BUNDLE=OFF \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=$PWD/native/scripts/tvos-sim-spawn.sh;$UDID"
      - name: Build
        run: cmake --build native/build/tvos-sim --parallel
      - name: Corpus + conformance tests (Apple TV simulator)
        run: ctest --test-dir native/build/tvos-sim --output-on-failure

  android-ndk:
    # The Android TV leg: NDK cross-compile with the same strict FP flags.
    #
    # BOTH ABIS, and armeabi-v7a is not the legacy one here. Android TV boxes
    # ship 32-bit userspace well past the point phones stopped: a Google TV
    # Streamer on Android 14 reports `ro.product.cpu.abilist=armeabi-v7a,armeabi`
    # and carries no /system/bin/linker64 at all, so an arm64 build is not a
    # slower path on that hardware, it is an unloadable one.
    #
    # Compile-only HERE, because a GitHub runner has no TV. The fixtures do now
    # run on real hardware: native/scripts/android-device-spawn.sh is the adb
    # equivalent of the tvOS simctl shim, so `ctest` drives the whole suite on a
    # box over adb. That is a scripted-manual run, and fp-profile.md §6's
    # contraction risk is what it exists to answer.
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Configure (NDK, ${{ matrix.abi }})
        run: cmake -S native -B native/build/android -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24
      - name: Build
        run: cmake --build native/build/android --parallel
